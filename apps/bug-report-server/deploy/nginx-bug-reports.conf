# Koma bug-report intake for koma-studio.site.
# This file is a template, not a drop-in include: part 0 belongs at http
# context next to the zone declaration, part 2 inside the existing
# koma-studio.site 443 server block.
# Real-IP note: with Cloudflare proxied (orange cloud), $remote_addr and the
# X-Forwarded-For tail are Cloudflare edge IPs, so rate limiting and abuse
# forensics key on the edge instead of the user. Part 0 restores the true
# client IP via CF-Connecting-IP. If the domain is DNS-only (grey cloud),
# part 0 must be omitted or every client would appear as 0.0.0.0.

# Part 0 - Cloudflare real-IP restore at http context (proxy mode only;
# ranges from https://www.cloudflare.com/ips/ — keep in sync at deploy time):
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Part 1 - declare once at http context (e.g. /etc/nginx/conf.d/koma-bug-reports-zone.conf):
limit_req_zone $binary_remote_addr zone=bugreports:10m rate=10r/m;

# Part 2 - paste into the existing
#   server { listen 443 ssl; server_name koma-studio.site; }
# block, then validate and reload: nginx -t && systemctl reload nginx

location = /api/bug-reports {
    limit_req zone=bugreports burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/bug-reports/healthz {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
