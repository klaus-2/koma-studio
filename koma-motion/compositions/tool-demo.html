<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"kind","type":"string","label":"Tool Kind","default":"healing"},{"id":"theme","type":"string","label":"Theme","default":"noir"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=440, height=232" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/tool-demos.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 440px;
        height: 232px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 440px;
        height: 232px;
        position: relative;
      }
      #stage,
      .td-svg {
        width: 440px;
        height: 232px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="tool-demo"
      data-start="0"
      data-duration="2.4"
      data-fps="30"
      data-width="440"
      data-height="232"
    >
      <div
        id="stage"
        class="clip"
        data-start="0"
        data-duration="2.4"
        data-track-index="0"
      ></div>
    </div>
    <script>
      (function () {
        const vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === 'function'
            ? window.__hyperframes.getVariables()
            : { kind: 'healing', theme: 'noir' };
        const kind = vars.kind || 'healing';
        const theme = vars.theme || 'noir';
        const stage = document.getElementById('stage');
        stage.innerHTML = window.KomaToolDemos.buildSceneMarkup(kind, theme, 'td-' + kind + '-' + theme);
        const svg = stage.querySelector('svg');
        const tl = window.KomaToolDemos.buildToolTimeline(svg, kind, 2.4);
        window.__timelines = window.__timelines || {};
        window.__timelines['tool-demo'] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
