<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1800, height=1120" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/tool-demos.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1800px;
        height: 1120px;
        overflow: hidden;
        background: #07070d;
        color: #f2ede3;
        font-family: 'JetBrains Mono', monospace;
      }
      #root {
        width: 1800px;
        height: 1120px;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid rgba(242, 237, 227, 0.14);
        padding-bottom: 10px;
        font-size: 15px;
        letter-spacing: 0.12em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .cell {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .cell .wrap {
        width: 100%;
        aspect-ratio: 440 / 232;
        border: 1px solid rgba(242, 237, 227, 0.15);
      }
      .td-svg { width: 100%; height: 100%; display: block; }
      .lbl { font-size: 10px; opacity: 0.72; text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tools-sheet" data-no-timeline data-start="0" data-duration="1" data-width="1800" data-height="1120">
      <div class="hdr">
        <span>KŌMA STUDIO — 17 TOOL & AIO STAGE ANIMATIONS QA (MID-ACTION FRAME t=1.2s)</span>
        <span style="color:#ff2e63">// NOIR & CLASSIC PALETTES</span>
      </div>
      <div id="grid" class="grid"></div>
    </div>
    <script>
      (function () {
        const grid = document.getElementById('grid');
        window.KomaToolDemos.TOOL_KINDS.forEach(function (kind, i) {
          const theme = i % 2 === 0 ? 'noir' : 'classic';
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.innerHTML =
            '<div class="wrap">' +
            window.KomaToolDemos.buildSceneMarkup(kind, theme, 'qa-' + kind) +
            '</div><div class="lbl">' + kind + ' (' + theme + ')</div>';
          grid.appendChild(cell);
          const svg = cell.querySelector('svg');
          const tl = window.KomaToolDemos.buildToolTimeline(svg, kind, 2.4);
          tl.seek(1.15);
        });
      })();
    </script>
  </body>
</html>
