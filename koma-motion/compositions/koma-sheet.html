<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=960" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/koma-rig.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1600px;
        height: 960px;
        overflow: hidden;
        background: #0b0710;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        color: #f2ede3;
      }
      #root {
        width: 1600px;
        height: 960px;
        padding: 28px 34px;
        background:
          radial-gradient(ellipse at 18% 12%, rgba(255, 30, 110, 0.14), transparent 50%),
          radial-gradient(ellipse at 86% 84%, rgba(0, 216, 255, 0.1), transparent 52%),
          linear-gradient(160deg, #110b12 0%, #09070d 55%, #160c14 100%);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid rgba(242, 237, 227, 0.12);
        padding-bottom: 12px;
      }
      .hdr h1 {
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .hdr span {
        font-size: 12px;
        color: #ff2e7a;
        letter-spacing: 0.18em;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 16px;
        flex: 1;
      }
      .cell {
        position: relative;
        background: radial-gradient(circle at 50% 48%, #26121b 0%, #120b12 72%, #0c080f 100%);
        border: 1px solid rgba(242, 237, 227, 0.11);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 10px 8px 26px;
      }
      .cell .wrap {
        width: 196px;
        height: 196px;
      }
      .cell .koma-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .label {
        position: absolute;
        bottom: 8px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(242, 237, 227, 0.78);
      }
      .label em {
        font-style: normal;
        color: #ffd166;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="koma-sheet"
      data-no-timeline
      data-start="0"
      data-duration="1"
      data-width="1600"
      data-height="960"
    >
      <div class="hdr">
        <h1>KOMA NEEKO — RIG QA CONTACT SHEET (13 STUDIO POSES)</h1>
        <span>// VISUAL BIBLE FIDELITY CHECK · DARK NOIR PLUM SURFACE</span>
      </div>
      <div id="grid" class="grid"></div>
    </div>
    <script>
      (function () {
        const grid = document.getElementById('grid');
        window.KomaRig.POSES.forEach(function (pose, idx) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const num = String(idx + 1).padStart(2, '0');
          cell.innerHTML =
            '<div class="wrap">' +
            window.KomaRig.buildSvgMarkup(pose, 'qa-' + pose) +
            '</div>' +
            '<div class="label"><em>' +
            num +
            '</em><span>' +
            pose +
            '</span></div>';
          grid.appendChild(cell);
        });
      })();
    </script>
  </body>
</html>
