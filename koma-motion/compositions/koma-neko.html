<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"pose","type":"string","label":"Pose","default":"idle"},{"id":"bg","type":"string","label":"Background","default":"transparent"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=320, height=320" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/koma-rig.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 320px;
        height: 320px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 320px;
        height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      #stage {
        width: 286px;
        height: 286px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .koma-svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="koma-neko"
      data-start="0"
      data-duration="2.4"
      data-fps="60"
      data-width="320"
      data-height="320"
    >
      <div
        id="stage"
        class="clip"
        data-start="0"
        data-duration="2.4"
        data-track-index="0"
        data-layout-allow-overflow
      ></div>
    </div>
    <script>
      (function () {
        const vars =
          window.__hyperframes && typeof window.__hyperframes.getVariables === 'function'
            ? window.__hyperframes.getVariables()
            : { pose: 'idle', bg: 'transparent' };
        const pose = vars.pose || 'idle';
        const bg = vars.bg || 'transparent';
        if (bg !== 'transparent') {
          document.documentElement.style.background = bg;
          document.body.style.background = bg;
          document.getElementById('root').style.background = bg;
        }
        const stage = document.getElementById('stage');
        stage.innerHTML = window.KomaRig.buildSvgMarkup(pose, 'koma-' + pose);
        const svg = stage.querySelector('svg');
        const tl = window.KomaRig.buildPoseTimeline(svg, pose, 2.4);
        window.__timelines = window.__timelines || {};
        window.__timelines['koma-neko'] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
