version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: "/packages/mini-backend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "mini-backend"]

  - package-ecosystem: pip
    directory: "/apps/discord-support-bot"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "discord-bot"]

  - package-ecosystem: cargo
    directory: "/apps/tauri/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]

  - package-ecosystem: cargo
    directory: "/apps/tools/koma-build-tool/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
