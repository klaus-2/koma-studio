name: Runtime Engine Artifacts (Layer 1)

on:
  workflow_dispatch:
    inputs:
      engine_version:
        description: "Engine release version (e.g. 1.0.0)"
        required: true

concurrency:
  group: runtime-engine-${{ inputs.engine_version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  init-draft:
    name: Ensure draft runtime-engine release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TAG: runtime-engine-v1-${{ inputs.engine_version }}
          ENGINE_VERSION: ${{ inputs.engine_version }}
        run: |
          set -euo pipefail
          if gh release view "$ENGINE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft >/tmp/rel.json 2>/dev/null; then
            if grep -q '"isDraft":false' /tmp/rel.json; then
              echo "::error::Runtime engine release $ENGINE_TAG is already published."
              exit 1
            fi
            echo "Draft release $ENGINE_TAG already exists."
          else
            gh release create "$ENGINE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --prerelease \
              --title "Runtime Engine v1 (${ENGINE_VERSION})" \
              --notes "Relocatable Python 3.12 Layer-1 runtime engine artifacts (${ENGINE_VERSION})."
          fi

  build:
    name: Build (${{ matrix.id }})
    needs: init-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: win-base
            os: windows-latest
            profiles: "cpu,windows-directml,intel-openvino"
            manifest: koma-runtime-win32-x64.json
          - id: win-cuda
            os: windows-latest
            profiles: "nvidia-cuda"
            manifest: koma-runtime-win32-x64.json
          - id: win-cuda-legacy
            os: windows-latest
            profiles: "nvidia-cuda-legacy"
            manifest: koma-runtime-win32-x64.json
          - id: linux-base
            os: ubuntu-22.04
            profiles: "cpu,intel-openvino"
            manifest: koma-runtime-linux-x64.json
          - id: linux-cuda
            os: ubuntu-22.04
            profiles: "nvidia-cuda"
            manifest: koma-runtime-linux-x64.json
          - id: mac-arm64
            os: macos-latest
            profiles: "cpu,apple-mps"
            manifest: koma-runtime-darwin-arm64.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install uv
        run: python -m pip install uv
      - name: Build & smoke-test engine profiles (${{ matrix.profiles }})
        run: >
          node scripts/release/build-engine-base.mjs
          --engine-version "${{ inputs.engine_version }}"
          --profiles "${{ matrix.profiles }}"
          --out release-artifacts/engine
      - name: Attest engine shards with GitHub OIDC provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-artifacts/engine/*.tar.zst
      - name: Upload engine shards to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TAG: runtime-engine-v1-${{ inputs.engine_version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          shards=(release-artifacts/engine/*.tar.zst)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "::error::No engine .tar.zst shards produced"
            exit 1
          fi
          gh release upload "$ENGINE_TAG" "${shards[@]}" --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: partial-manifest-${{ matrix.id }}
          path: release-artifacts/engine/${{ matrix.manifest }}
          if-no-files-found: error
          retention-days: 7

  merge-manifests:
    name: Merge & upload koma-runtime manifests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          pattern: partial-manifest-*
          path: partial-manifests
      - name: Merge partial manifests & upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TAG: runtime-engine-v1-${{ inputs.engine_version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF'
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";

          const root = path.resolve("partial-manifests");
          const byName = new Map();

          const walk = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const abs = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(abs);
              else if (entry.isFile() && /^koma-runtime-.*\.json$/.test(entry.name)) {
                const list = byName.get(entry.name) ?? [];
                list.push(abs);
                byName.set(entry.name, list);
              }
            }
          };
          walk(root);

          if (byName.size === 0) {
            throw new Error("No partial koma-runtime-*.json manifests downloaded");
          }

          const mergedDir = path.resolve("merged-manifests");
          fs.mkdirSync(mergedDir, { recursive: true });
          const uploadPaths = [];

          for (const [name, paths] of byName.entries()) {
            let merged = null;
            const profiles = {};
            for (const filePath of paths.toSorted()) {
              const parsed = JSON.parse(fs.readFileSync(filePath, "utf8"));
              if (!merged) merged = parsed;
              Object.assign(profiles, parsed.profiles ?? {});
            }
            const sortedProfiles = Object.fromEntries(
              Object.entries(profiles).toSorted(([a], [b]) => a.localeCompare(b)),
            );
            merged.profiles = sortedProfiles;
            const outPath = path.join(mergedDir, name);
            fs.writeFileSync(outPath, `${JSON.stringify(merged, null, 2)}\n`, "utf8");
            uploadPaths.push(outPath);
            console.log(`[merge] ${name}: ${Object.keys(sortedProfiles).join(", ")}`);
          }

          const up = spawnSync(
            "gh",
            ["release", "upload", process.env.ENGINE_TAG, "--repo", process.env.GITHUB_REPOSITORY, ...uploadPaths, "--clobber"],
            { stdio: "inherit" },
          );
          if (up.status !== 0) {
            throw new Error(`gh release upload failed (${up.status})`);
          }
          EOF
