name: Release Build (Electron)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: win
        type: choice
        options: [win, linux, mac]

jobs:
  build:
    name: Build (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'win' && 'windows-latest' || inputs.platform == 'mac' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install JS dependencies (workspace root)
        working-directory: .
        run: bun install
      - name: Build application
        run: bun run build:app
        env:
          # CI builds don't need real secrets; app builds are unsigned here.
          VITE_ENV: production
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koma-studio-${{ inputs.platform }}
          path: |
            apps/electron/release-desktop/*
          if-no-files-found: warn
          retention-days: 14
