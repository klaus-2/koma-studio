name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please keep in mind that KŌMA Studio is a
        **100% free, local-first** tool — proposals that require paid tiers,
        usage quotas or user tracking are out of scope by design.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This does not require paid plans, quotas, or telemetry.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is painful today.
      placeholder: |
        When typesetting long series, I re-create the same font styles for every chapter...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop shell (Tauri / Rust)
        - Interface (React)
        - Mini-backend (Python / FastAPI)
        - Models & downloads
        - Build / packaging
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how comparable tools handle this.
