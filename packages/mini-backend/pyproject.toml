[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The default suite is offline; slow tests download real model weights.
addopts = "-m 'not slow'"
markers = [
    "integration: integration without external desktop applications",
    "slow: downloads real model weights; excluded from the default suite",
]

[tool.pyright]
pythonVersion = "3.12"
include = ["mini_backend_tools", "utils", "scripts"]
extraPaths = ["."]
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["mini_backend_tools", "utils"]
relative_files = true
