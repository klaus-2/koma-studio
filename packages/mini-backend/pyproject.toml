[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration without external desktop applications",
]

[tool.pyright]
pythonVersion = "3.12"
include = ["mini_backend_tools", "utils", "scripts"]
extraPaths = ["."]
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["mini_backend_tools", "utils"]
relative_files = true
